services:
  postgres:
    image: postgres:18
    container_name: kaserva-postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: